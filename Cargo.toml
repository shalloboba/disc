[package]
name = "litecord"
version = "0.3.0"
edition = "2021"
description = "Light Discord client (Bot API) with an egui GUI, inline images, Discord login and voice rooms"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
cpal = "0.15"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = "1"
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.21"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
